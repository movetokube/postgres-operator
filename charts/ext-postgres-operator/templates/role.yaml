apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "chart.fullname" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
rules:
{{- if .Values.rbac.clusterWide }}
  - apiGroups:
      - ""
    resources:
      - configmaps
      - secrets
      - services
    verbs:
      - "*"
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
      - update
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - apps
    resources:
      - replicasets
      - deployments
    verbs:
      - get
{{- else }}
  {{- if .Values.rbac.secretNames }}
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      {{- toYaml .Values.rbac.secretNames | nindent 6 }}
    verbs:
      - get
      - update
      - patch
      - delete
  {{- else }}
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - create
      - update
      - patch
      - delete
  {{- end }}
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    resourceNames:
      - {{ include "chart.leaseName" . }}
    verbs:
      - get
      - update
  - apiGroups:
      - db.movetokube.com
    resources:
      - postgres
      - postgresusers
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - db.movetokube.com
    resources:
      - postgres/status
      - postgresusers/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - db.movetokube.com
    resources:
      - postgres/finalizers
      - postgresusers/finalizers
    verbs:
      - update
{{- end }}
